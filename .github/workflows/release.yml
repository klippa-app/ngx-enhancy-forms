name: NPM Publish

on:
  push:
    branches:
      - main
      - main-v[0-9]+

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "./package.json"
          registry-url: 'https://registry.npmjs.org'
      - run: npm install npm@latest -g
      - run: yarn install
      - run: yarn build:prod
      - run: npm --version
      - run: npm publish --provenance ./dist/klippa/ngx-enhancy-forms
