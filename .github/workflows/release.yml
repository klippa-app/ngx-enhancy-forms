name: NPM Publish

on:
  push:
    branches:
      - main
      - main-v[0-9]+

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "./package.json"
          registry-url: https://registry.npmjs.org
          always-auth: true
      - run: yarn install
      - run: yarn build:prod
      - run: npm publish ./dist/klippa/ngx-enhancy-forms
