<ng-template #listItem>
  @for (item of innerValue; track item; let index = $index) {
    <li
      class="sortableItem"
      [draggable]="!disabled"
			[ngClass]="{
			largeSortableItem: sortableItemSize === 'lg',
		 	smallSortableItem: sortableItemSize === 'sm',
		 	}"
      #dragItem
      >
      <div class="visual">
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ item: item, index:index }"></ng-container>
      </div>
    </li>
  }
</ng-template>

@if (!disabled) {
  <ol
    class="itemsContainer"
    [ngClass]="{dragInProgress: dragSourceIndex >= 0}"
    >
    <ng-container *ngTemplateOutlet="listItem"></ng-container>
  </ol>
}

@if (disabled) {
  <ol class="itemsContainer disabled-mouse-cursor">
    <ng-container *ngTemplateOutlet="listItem"></ng-container>
  </ol>
}
