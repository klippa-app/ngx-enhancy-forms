<klp-form-grid-control-base
	[caption]="caption"
	[description]="description"
	[disabled]="disabled"
	[sizeClass]="sizeClass"
	[captionSpacing]="captionSpacing">
	<ng-template #controlContent>
		<div class="toggleContainer" [ngClass]="{disabled: disabled}"
				 [style.--toggle-width]="toggleWidth + 'px'"
				 [style.--toggle-height]="toggleHeight + 'px'">
			<div class="hiddenValue" data-cy-value>{{ innerValue }}</div>
			<input type="checkbox" class="nativeCheckbox"
						 [(ngModel)]="innerValue"
						 (input)="setInnerValueAndNotify($event.target.checked); touch()"
						 [disabled]="disabled"
						 [ngClass]="{showErrors: isInErrorState()}"
						 #nativeInputRef
			/>
			<div class="toggleVisual" [ngClass]="{transparentBackground: transparentBackground}"></div>
		</div>
	</ng-template>
</klp-form-grid-control-base>
