<klp-form-border-control-base 
	[prefixTpl]="prefixTpl" 
	[suffixTpl]="suffixTpl"
	[disabled]="disabled"
	[sizeClass]="sizeClass"
	[isInErrorState]="isInErrorState()">
	<ng-template #inputContent>
		<input
			type="number"
			class="form-control"
			[ngModel]="innerValue"
			(ngModelChange)="setInnerValueAndNotify($event)"
			[placeholder]="placeholder ? placeholder : ''"
			[ngClass]="{showErrors: isInErrorState(), disabled: disabled}"
			[disabled]="disabled"
			#nativeInputRef
		/>
	</ng-template>
</klp-form-border-control-base>
