<ng-container>
  <klp-form-sortable-items
    [(ngModel)]="items"
    (ngModelChange)="onItemsRearranged($event)"
    >
    <ng-template let-item="item">
      @if (template) {
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ item: item }"></ng-container>
      }
      @if (!template) {
        <div>{{item}}</div>
      }
    </ng-template>
  </klp-form-sortable-items>
</ng-container>
