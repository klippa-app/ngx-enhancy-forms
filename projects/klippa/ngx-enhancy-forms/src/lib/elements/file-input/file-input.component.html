@if (fullyCustom) {
  <div class="fullyCustom">
    <input
      type="file"
      #nativeInputRef
      (change)="onChange($event.target.files)"
      [multiple]="multiple"
      [disabled]="disabled"
      />
    <div (click)="uploadFileClicked()">
      <ng-container [ngTemplateOutlet]="contentTpl"></ng-container>
    </div>
  </div>
}

@if (!fullyCustom) {
  <div class="componentContainer" [ngClass]="{fullParentSize: useFullParentSize, showErrors: isInErrorState()}"
    >
    <div class="buttonContainer">
      <input
        type="file"
        #nativeInputRef
        (change)="onChange($event.target.files)"
        [multiple]="multiple"
        [disabled]="disabled"
        >
      <klp-form-button
        class="uploadButton"
        [isLoading]="isLoading"
        [disabled]="disabled"
        (click)="uploadFileClicked()"
        >
        <div class="innerButton">
          @if (buttonText) {
            <span>{{ buttonText }}</span>
          }
          @if (!buttonText) {
            <div>
              <ng-container [ngTemplateOutlet]="contentTpl"></ng-container>
            </div>
          }
          <div class="tail">
            <ng-container [ngTemplateOutlet]="getTailTpl()"></ng-container>
          </div>
        </div>
      </klp-form-button>
    </div>
    @if (!onlyShowUploadButton) {
      <div class="fileName">
        {{ getFileNames() }}
      </div>
    }
    @if (shouldShowClearButton()) {
      <klp-form-button class="clearButton" variant="white" (click)="resetToNull()">X
      </klp-form-button>
    }
  </div>
}

<ng-template #contentTpl>
  <ng-content></ng-content>
</ng-template>
