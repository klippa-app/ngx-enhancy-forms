<div class="componentContainer" [ngClass]="{showErrors: isInErrorState()}">
	<input
		type="password"
		class="form-control"
		[class]="sizeClass"
		[(ngModel)]="innerValue"
		(input)="setInnerValueAndNotify($event.target.value)"
		[placeholder]="placeholder"
		(blur)="touch()"
		[disabled]="disabled"
		#nativeInputRef
	/>
</div>
