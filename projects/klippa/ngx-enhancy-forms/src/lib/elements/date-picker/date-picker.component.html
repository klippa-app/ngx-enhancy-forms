<div class="componentContainer" [ngClass]="{showErrors: isInErrorState()}">
	<klp-form-date-time-picker
		[multiple]="multiple"
		[disabled]="disabled"
		[(ngModel)]="dateValue"
		(ngModelChange)="dateChanged($event)"
		[minDate]="minDate"
		[maxDate]="maxDate"
		[sameMonthOnly]="sameMonthOnly"
		[format]="format"
		[placeholder]="getTranslation('placeholder')"
		[clearable]="clearable"
		[showTimeInput]="false"
		[getTailTplFn]="getTailTpl"
		(onTouch)="touch()"
		[size]="size"
		[suffixTpl]="suffixTpl"
		[prefixTpl]="prefixTpl"
	></klp-form-date-time-picker>
</div>
