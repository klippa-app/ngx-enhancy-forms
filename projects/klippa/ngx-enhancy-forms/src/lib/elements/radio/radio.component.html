<div class="componentContainer" [ngClass]="{'verticallyOriented': orientation === Orientation.COLUMN, 'horizontallyOriented': orientation === Orientation.ROW, buttonGray: variant === 'buttonGray', sizeSmall: size === 'small'}">
  @for (option of options; track option) {
    <button class="optionContainer"
      [ngClass]="{classic: variant === 'classic', button: variant === 'button', buttonGray: variant === 'buttonGray', isSelected: innerValue === option.id}"
      (click)="setInnerValueAndNotify(option.id)"
			[disabled]="disabled"
      >
      <div class="radioAndName">
        @if (variant === 'classic') {
          <div class="radioBtnContainer" [ngClass]="{selected: innerValue === option.id}">
            @if (innerValue === option.id) {
              <div class="innerCircle"></div>
            }
          </div>
        }
        <div class="nameAndDescription">
          <div>{{option.name}}</div>
          @if (option.description) {
            <div class="description">{{option.description}}</div>
          }
        </div>
      </div>
    </button>
  }
</div>
