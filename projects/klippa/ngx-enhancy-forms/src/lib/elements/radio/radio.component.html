<div class="componentContainer" [ngClass]="{'verticallyOriented': orientation === Orientation.COLUMN, 'horizontallyOriented': orientation === Orientation.ROW, buttonGray: variant === 'buttonGray'}">
  @for (option of options; track option) {
    @if (variant === 'classic') {
      <klp-form-grid-control-base
        [caption]="option.name"
        [description]="option.description"
        [disabled]="disabled"
        [sizeClass]="sizeClass"
        [captionSpacing]="captionSpacing">
        <ng-template #controlContent>
          <div class="radioVisualContainer" [style.--radio-size]="radioSize + 'px'">
            <input type="radio"
              class="radioNative"
              [checked]="innerValue === option.id"
              (change)="setInnerValueAndNotify(option.id); touch()"
              [disabled]="disabled"
            />
            <div class="radioBtnContainer" [ngClass]="{selected: innerValue === option.id}">
              @if (innerValue === option.id) {
                <div class="innerCircle"></div>
              }
            </div>
          </div>
        </ng-template>
      </klp-form-grid-control-base>
    } @else {
      <button class="optionContainer"
        [ngClass]="{button: variant === 'button', buttonGray: variant === 'buttonGray', isSelected: innerValue === option.id}"
        (click)="setInnerValueAndNotify(option.id)"
        [disabled]="disabled"
        >
        <div class="nameAndDescription">
          <div>{{option.name}}</div>
          @if (option.description) {
            <div class="description">{{option.description}}</div>
          }
        </div>
      </button>
    }
  }
</div>
